<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Dr. Radjabov — стоматология</title>

<!-- Telegram Mini App SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Шрифты, которые использует дизайн -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Tailwind (используется дизайном для className вида flex/px-5/rounded-2xl и т.д.) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- React напрямую из браузера, без сборки проекта -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react"
  }
}
</script>

<!-- Babel компилирует JSX прямо в браузере пользователя -->
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<style>
  html, body { margin: 0; padding: 0; background: #EAF4FB; height: 100%; overflow: hidden; }
  #root { width: 100%; height: 100dvh; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .animate-spin { animation: spin 1s linear infinite; }
</style>
</head>
<body>
  <div id="root"></div>

  <!-- Дизайн приложения (app.jsx) компилируется Babel'ом на лету -->
  <script type="text/babel" data-type="module" data-presets="react" src="/app.jsx"></script>
</body>
</html>
