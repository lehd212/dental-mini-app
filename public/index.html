<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Стоматология — запись и ассистент</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --teal-900: #103F3C;
    --teal-700: #14504C;
    --teal-500: #2C7A72;
    --mint-100: #E4F3EE;
    --mint-200: #CFE9E0;
    --paper: #FAFAF7;
    --ink: #1C2B29;
    --ink-soft: #5B6E6A;
    --gold: #D9A441;
    --gold-soft: #F3E3C2;
    --danger: #C1553F;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  #app {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ---------- Header ---------- */
  .header {
    background: var(--teal-700);
    color: white;
    padding: 22px 20px 30px;
    position: relative;
  }
  .header__eyebrow {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--mint-200);
    margin: 0 0 4px;
  }
  .header__title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 24px;
    margin: 0;
    line-height: 1.15;
  }
  .header__meta {
    margin-top: 8px;
    font-size: 13px;
    color: var(--mint-100);
    opacity: 0.9;
  }
  .smile-arc {
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    width: 100%; height: 22px;
    display: block;
  }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex;
    gap: 6px;
    background: white;
    margin: -14px 16px 0;
    padding: 5px;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(16,63,60,0.10);
    position: relative;
    z-index: 2;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px 8px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
    transition: background .2s ease, color .2s ease;
    user-select: none;
  }
  .tab.active {
    background: var(--teal-700);
    color: white;
  }

  .view { display: none; flex: 1; flex-direction: column; padding: 18px 16px 90px; }
  .view.active { display: flex; }

  /* ---------- Chat ---------- */
  #chatMessages { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .msg {
    max-width: 82%;
    padding: 11px 14px;
    border-radius: var(--radius-md);
    font-size: 14.5px;
    line-height: 1.45;
    animation: rise .22s ease-out;
    white-space: pre-wrap;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .msg.assistant {
    align-self: flex-start;
    background: white;
    border: 1px solid var(--mint-200);
    border-bottom-left-radius: 4px;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--teal-700);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.typing { align-self: flex-start; background: white; border: 1px solid var(--mint-200); display: flex; gap: 4px; padding: 13px 16px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--teal-500); animation: bounce 1.1s infinite; }
  .dot:nth-child(2) { animation-delay: .15s; } .dot:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: .5;} 30% { transform: translateY(-4px); opacity: 1; } }

  .composer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--paper);
    border-top: 1px solid var(--mint-200);
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    display: flex;
    gap: 8px;
  }
  .composer input {
    flex: 1;
    border: 1px solid var(--mint-200);
    background: white;
    border-radius: 999px;
    padding: 12px 16px;
    font-size: 14.5px;
    font-family: inherit;
    outline: none;
  }
  .composer input:focus { border-color: var(--teal-500); }
  .composer button {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: none;
    background: var(--teal-700);
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .composer button:disabled { opacity: .5; }

  /* ---------- Booking form ---------- */
  .section-label {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 600;
    margin: 4px 0 14px;
    color: var(--teal-900);
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .field input, .field select {
    width: 100%;
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--mint-200);
    background: white;
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
    outline: none;
  }
  .field input:focus, .field select:focus { border-color: var(--teal-500); }

  .price-chip {
    font-size: 12px;
    color: var(--teal-500);
    margin-top: 4px;
  }

  .submit-btn {
    margin-top: 8px;
    width: 100%;
    padding: 14px;
    background: var(--gold);
    color: var(--teal-900);
    border: none;
    border-radius: var(--radius-sm);
    font-size: 15.5px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }
  .submit-btn:disabled { opacity: .55; }

  .success-card {
    background: white;
    border: 1px solid var(--mint-200);
    border-radius: var(--radius-lg);
    padding: 28px 20px;
    text-align: center;
    margin-top: 20px;
  }
  .success-card .check {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: var(--mint-100);
    color: var(--teal-700);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    margin: 0 auto 14px;
  }
  .success-card h3 { font-family: 'Fraunces', serif; margin: 0 0 6px; color: var(--teal-900); }
  .success-card p { color: var(--ink-soft); font-size: 14px; margin: 2px 0; }

  .error-text { color: var(--danger); font-size: 13px; margin-top: 6px; }

  .concerns-label {
    font-size: 12.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--ink-soft);
    margin: 2px 0 8px;
  }
  .concerns-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }
  .concern-chip {
    background: white;
    border: 1px solid var(--mint-200);
    color: var(--teal-700);
    padding: 8px 13px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .concern-chip:active { background: var(--mint-100); }

  .services-hint {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 18px;
    line-height: 1.5;
  }
</style>
</head>
<body>
<div id="app">

  <div class="header">
    <p class="header__eyebrow" id="hdrEyebrow">Ваша стоматология</p>
    <h1 class="header__title" id="hdrName">Загрузка…</h1>
    <p class="header__meta" id="hdrMeta"></p>
    <svg class="smile-arc" viewBox="0 0 400 22" preserveAspectRatio="none">
      <path d="M0,0 Q200,26 400,0 L400,22 L0,22 Z" fill="var(--paper)" />
    </svg>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="chat">💬 Ассистент</div>
    <div class="tab" data-tab="booking">📅 Запись</div>
  </div>

  <!-- CHAT VIEW -->
  <div class="view active" id="view-chat">
    <p class="concerns-label" id="concernsLabel" style="display:none;">Что вас беспокоит?</p>
    <div class="concerns-row" id="concernsRow"></div>
    <div id="chatMessages"></div>
  </div>

  <!-- BOOKING VIEW -->
  <div class="view" id="view-booking">
    <p class="section-label">Записаться на приём</p>
    <p class="services-hint" id="servicesHint">Загружаем список услуг…</p>

    <form id="bookingForm">
      <div class="field">
        <label>Ваше имя</label>
        <input type="text" id="fName" required placeholder="Как к вам обращаться" />
      </div>
      <div class="field">
        <label>Телефон</label>
        <input type="tel" id="fPhone" required placeholder="+998 90 123 45 67" />
      </div>
      <div class="field">
        <label>Услуга</label>
        <select id="fService" required></select>
      </div>
      <div class="field">
        <label>Предпочтение по врачу</label>
        <select id="fDoctor"></select>
      </div>
      <div class="field">
        <label>Дата</label>
        <input type="date" id="fDate" required />
      </div>
      <div class="field">
        <label>Время</label>
        <select id="fTime" required></select>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">Записаться</button>
      <p class="error-text" id="bookingError" style="display:none;"></p>
    </form>

    <div class="success-card" id="successCard" style="display:none;">
      <div class="check">✓</div>
      <h3>Вы записаны!</h3>
      <p id="successDetails"></p>
      <p>Подтверждение и напоминание придут прямо в Telegram.</p>
    </div>
  </div>

  <div class="composer" id="composer">
    <input type="text" id="chatInput" placeholder="Спросите об услугах, ценах, врачах…" />
    <button id="sendBtn">➤</button>
  </div>

</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  const initData = tg?.initData || "";
  const tgUser = tg?.initDataUnsafe?.user;

  let clinicConfig = null;
  const chatHistory = [];

  // ---------- Загрузка данных клиники ----------
  async function loadConfig() {
    try {
      const res = await fetch("/api/config");
      clinicConfig = await res.json();

      document.getElementById("hdrName").textContent = clinicConfig.clinicName;
      document.getElementById("hdrMeta").textContent =
        `${clinicConfig.workingHours} · ${clinicConfig.phone}`;

      document.getElementById("servicesHint").textContent =
        "Выберите услугу и удобное время — подтверждение придёт в этот чат.";

      const serviceSelect = document.getElementById("fService");
      clinicConfig.services.forEach((s) => {
        const opt = document.createElement("option");
        opt.value = s.name;
        opt.textContent = `${s.name} — ${s.price}`;
        serviceSelect.appendChild(opt);
      });

      const doctorSelect = document.getElementById("fDoctor");
      clinicConfig.doctorGenderOptions.forEach((g) => {
        const opt = document.createElement("option");
        opt.value = g;
        opt.textContent = g;
        doctorSelect.appendChild(opt);
      });

      // Раздел "Что вас беспокоит" — чипы с частыми жалобами
      const concernsRow = document.getElementById("concernsRow");
      clinicConfig.commonConcerns.forEach((c) => {
        const chip = document.createElement("div");
        chip.className = "concern-chip";
        chip.textContent = c.label;
        chip.addEventListener("click", () => sendMessage(c.message));
        concernsRow.appendChild(chip);
      });
      document.getElementById("concernsLabel").style.display = "block";

      const timeSelect = document.getElementById("fTime");
      clinicConfig.timeSlots.forEach((t) => {
        const opt = document.createElement("option");
        opt.value = t;
        opt.textContent = t;
        timeSelect.appendChild(opt);
      });

      // Приветственное сообщение ассистента
      addMessage("assistant", `Здравствуйте${tgUser?.first_name ? ", " + tgUser.first_name : ""}! Я ассистент клиники «${clinicConfig.clinicName}». Спросите об услугах, ценах или врачах — или сразу переходите на вкладку «Запись».`);
    } catch (e) {
      document.getElementById("hdrName").textContent = "Не удалось загрузить данные";
    }
  }

  // Минимальная дата = сегодня
  document.getElementById("fDate").min = new Date().toISOString().split("T")[0];

  // ---------- Табы ----------
  document.querySelectorAll(".tab").forEach((tab) => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
      document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));
      tab.classList.add("active");
      document.getElementById("view-" + tab.dataset.tab).classList.add("active");
      document.getElementById("composer").style.display = tab.dataset.tab === "chat" ? "flex" : "none";
    });
  });

  // ---------- Чат ----------
  function addMessage(role, text) {
    const el = document.createElement("div");
    el.className = "msg " + role;
    el.textContent = text;
    document.getElementById("chatMessages").appendChild(el);
    el.scrollIntoView({ behavior: "smooth", block: "end" });
  }

  function showTyping() {
    const el = document.createElement("div");
    el.className = "msg typing";
    el.id = "typingIndicator";
    el.innerHTML = "<div class='dot'></div><div class='dot'></div><div class='dot'></div>";
    document.getElementById("chatMessages").appendChild(el);
    el.scrollIntoView({ behavior: "smooth", block: "end" });
  }
  function hideTyping() {
    document.getElementById("typingIndicator")?.remove();
  }

  async function sendMessage(presetText) {
    const input = document.getElementById("chatInput");
    const text = (presetText || input.value).trim();
    if (!text) return;

    // Прячем чипы "Что вас беспокоит" после первого сообщения, чтобы не мешали чату
    document.getElementById("concernsLabel").style.display = "none";
    document.getElementById("concernsRow").style.display = "none";

    addMessage("user", text);
    chatHistory.push({ role: "user", content: text });
    input.value = "";
    document.getElementById("sendBtn").disabled = true;
    showTyping();

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: chatHistory }),
      });
      const data = await res.json();
      hideTyping();
      const reply = data.reply || "Извините, произошла ошибка. Попробуйте ещё раз.";
      addMessage("assistant", reply);
      chatHistory.push({ role: "assistant", content: reply });
    } catch (e) {
      hideTyping();
      addMessage("assistant", "Не удалось связаться с сервером. Проверьте интернет и попробуйте снова.");
    } finally {
      document.getElementById("sendBtn").disabled = false;
    }
  }

  document.getElementById("sendBtn").addEventListener("click", sendMessage);
  document.getElementById("chatInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });

  // ---------- Форма записи ----------
  if (tgUser?.first_name) {
    document.getElementById("fName").value = [tgUser.first_name, tgUser.last_name].filter(Boolean).join(" ");
  }

  document.getElementById("bookingForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById("bookingError");
    errorEl.style.display = "none";
    const submitBtn = document.getElementById("submitBtn");
    submitBtn.disabled = true;
    submitBtn.textContent = "Записываем…";

    const payload = {
      initData,
      name: document.getElementById("fName").value,
      phone: document.getElementById("fPhone").value,
      service: document.getElementById("fService").value,
      doctor: document.getElementById("fDoctor").value,
      date: document.getElementById("fDate").value,
      time: document.getElementById("fTime").value,
    };

    try {
      const res = await fetch("/api/book", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();

      if (!res.ok) {
        errorEl.textContent = data.error || "Не удалось создать запись";
        errorEl.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = "Записаться";
        return;
      }

      document.getElementById("bookingForm").style.display = "none";
      document.getElementById("successCard").style.display = "block";
      document.getElementById("successDetails").textContent =
        `${payload.service} · ${payload.date} в ${payload.time}`;
    } catch (e) {
      errorEl.textContent = "Ошибка сети. Проверьте подключение и попробуйте снова.";
      errorEl.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.textContent = "Записаться";
    }
  });

  loadConfig();
</script>
</body>
</html>
